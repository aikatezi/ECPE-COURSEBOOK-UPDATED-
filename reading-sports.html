&lt;section id=&quot;before&quot;&gt;
 &lt;div class=&quot;sectionHead&quot;&gt;&lt;h2&gt;BEFORE&lt;br&gt;YOU READ&lt;/h2&gt;&lt;span&gt;01 / WARM-UP &amp; CORE VOCABULARY&lt;/span&gt;&lt;/div&gt;
 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;A — Discuss with a partner&lt;/h3&gt;
   &lt;ol class=&quot;discuss-list&quot;&gt;&lt;li&gt;In what situations do you really need intense concentration? What helps you achieve it?&lt;/li&gt;&lt;li&gt;Do you ever find yourself so absorbed in an activity that you're unaware of what's happening around you? When does that happen?&lt;/li&gt;&lt;li&gt;Do you tend to trust your intuition when you have to make a decision, or do you try to base your decisions on fact and logic?&lt;/li&gt;&lt;li&gt;What takes priority in your life? Which is most important – your studies? sports? your social life?&lt;/li&gt;&lt;li&gt;Has self-consciousness or embarrassment ever kept you from speaking in front of others? When?&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;discussion-support&quot;&gt;&lt;div class=&quot;functional-vocab&quot;&gt;&lt;h4&gt;FUNCTIONAL VOCABULARY&lt;/h4&gt;&lt;div&gt;&lt;strong&gt;From my point of view, ...&lt;/strong&gt;&lt;span&gt;Κατά τη γνώμη μου, ...&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;I tend to think that ...&lt;/strong&gt;&lt;span&gt;Τείνω να πιστεύω ότι ...&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;What helps me concentrate is ...&lt;/strong&gt;&lt;span&gt;Αυτό που με βοηθά να συγκεντρωθώ είναι ...&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;I usually rely on ...&lt;/strong&gt;&lt;span&gt;Συνήθως βασίζομαι σε ...&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;What takes priority for me is ...&lt;/strong&gt;&lt;span&gt;Αυτό που έχει προτεραιότητα για μένα είναι ...&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;I find myself completely absorbed in ...&lt;/strong&gt;&lt;span&gt;Απορροφιέμαι εντελώς σε ...&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;It depends on the situation because ...&lt;/strong&gt;&lt;span&gt;Εξαρτάται από την κατάσταση επειδή ...&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;One example that comes to mind is ...&lt;/strong&gt;&lt;span&gt;Ένα παράδειγμα που μου έρχεται στο μυαλό είναι ...&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;img src=&quot;https://images.pexels.com/photos/6813645/pexels-photo-6813645.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1200&quot; alt=&quot;Focused athlete&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

&lt;p&gt;&lt;strong&gt;a.&lt;/strong&gt; No, there was some &lt;b&gt;turbulence&lt;/b&gt; when we flew over the Alps, but nothing serious.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;b.&lt;/strong&gt; Yes, there are several activities that can improve &lt;b&gt;visual perception&lt;/b&gt; and reaction time.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;c.&lt;/strong&gt; Yes, it increases &lt;b&gt;buoyancy&lt;/b&gt; and helps young swimmers stay near the surface.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;d.&lt;/strong&gt; Yes. Air resistance can &lt;b&gt;impede&lt;/b&gt; forward movement and affect speed.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;e.&lt;/strong&gt; Yes, I was. I &lt;b&gt;attained&lt;/b&gt; the result I had been aiming for.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;f.&lt;/strong&gt; Yes. It can &lt;b&gt;inhibit&lt;/b&gt; performance by making accurate shots more difficult.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;readingTop reading-side-by-side&quot; quiet-eye-layout&quot;&gt;&lt;div class=&quot;readingTitle&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;TEXT 01&lt;/div&gt;&lt;h2&gt;QUIET EYE&lt;/h2&gt;&lt;p&gt;Improving performance in sports&lt;/p&gt;&lt;/div&gt;&lt;img src=&quot;https://images.pexels.com/photos/34552176/pexels-photo-34552176/free-photo-of-athlete-practicing-free-throws-in-indoor-basketball-arena.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1400&quot; alt=&quot;Basketball player concentrating on a free throw&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;unitAudioPlayer&quot;&gt;&lt;b&gt;READING AUDIO — QUIET EYE&lt;/b&gt;&lt;audio controls preload=&quot;metadata&quot;&gt;&lt;source src=&quot;assets/audio_01_9506ac55eb6e6796.mp3&quot; type=&quot;audio/mpeg&quot;&gt;&lt;/audio&gt;&lt;/div&gt;&lt;div class=&quot;passage&quot;&gt;The factors that contribute to successful performance in sport are many and complex. Scientists, however, have pinpointed one phenomenon, identified as Quiet Eye (QE), which seems to be associated with peak performance not only in sports, but also when performing surgery, flying a jet, or doing anything that requires hand-eye coordination. QE is the intense concentration of the eyes on a task-relevant location just before the final phase of a desired movement. The eye only needs to remain still for a fraction longer to make a difference, and empirical studies have shown that the discrepancy in focus duration between an amateur and an expert may be as little as one-fifth of a second.

While there is some overlap between them, quiet eye differs significantly from the state called the zone. When an athlete enters the zone, he or she becomes completely absorbed in the task at hand, and immune to all distractions. During this much sought-after state, limitations fade away and pure intuition seems to take over. Outstanding athletes describe the zone as an almost mystical experience during which there is an impression of perfect harmony between mind and body. Quiet eye, on the other hand, refers specifically to visual perception. It is a measurable phenomenon, and crucially, it is teachable. One study of basketball players found that a team trained in QE techniques over two seasons improved their free-throw accuracy by 23% and attained a total 76% success rate. Teams without the training improved to a much lesser extent, if at all.

Interestingly, children with mobility or coordination issues, whose self-consciousness may prevent them from playing with other children, also respond well to this type of training. In an experiment involving 30 children, those who underwent QE training that involved tracking a tennis ball with their eyes had much better outcomes than those trained only in physical techniques. Such improvements may keep children's anxiety at bay when playing with others.

In light of these discoveries, devotion solely to honing physical skills, which has taken priority in much sports and professional training, may now shift to including quiet eye training in order to reach higher levels of success.&lt;/div&gt;

  &lt;div class=&quot;readingTop&quot;&gt;&lt;div class=&quot;readingTitle&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;TEXT 02&lt;/div&gt;&lt;h2&gt;TECH&lt;br&gt;DOPING&lt;/h2&gt;&lt;p&gt;The use of technology in sports&lt;/p&gt;&lt;/div&gt;&lt;img src=&quot;https://img.ihned.cz/attachment.php/630/79022630/2Mh4xtCpuwBkGUAvr9IlsicVLPnHKqaz/1536x1232xcf81/MTF_3234_kopie.jpg&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;unitAudioPlayer&quot;&gt;&lt;b&gt;READING AUDIO — TECH DOPING&lt;/b&gt;&lt;audio controls preload=&quot;metadata&quot;&gt;&lt;source src=&quot;assets/audio_02_b243b5f94de5d89e.mp3&quot; type=&quot;audio/mpeg&quot;&gt;&lt;/audio&gt;&lt;/div&gt;&lt;div class=&quot;passage&quot;&gt;For competitive athletes, a split second can mean the difference between victory and defeat. As a result, intensive research is devoted to creating clothing and equipment that enable athletes to optimize their potential. This trend is sometimes called technological doping because it confers an unfair advantage not unlike using illegal substances, such as steroids, to enhance performance.

One instance of possible high-tech doping is the Nike Vaporfly running shoe, the sole of which is constructed to help propel runners forward. Early studies showed that these shoes improved an athlete's running economy – i.e., the energy needed to run at a given pace – by as much as 6.25%. The first runner to cover the marathon distance in less than two hours, a feat generally believed to be humanly impossible in conventional footwear, wore them to do so. In light of the effect of these running shoes, many people have questioned whether athletes should be allowed to wear such shoes in competitions. The World Athletics organization is now reviewing rules regarding the design and construction of running shoes.

Another example of high-tech sportswear is competitive swimming gear. Engineers and manufacturers grappled for years with how to counteract drag, a force which impedes progress and has an adverse effect on a swimmer's speed. Swimmers encounter drag predominantly due to the turbulence in the water generated by their movements. The total drag force increases proportionately with speed and inhibits performance. A state-of-the-art bodysuit was launched in 2008 that reduced friction, maintained flexibility, and enhanced buoyancy, letting swimmers float higher in the water. The fabric of the suit was incorporated in a special coating to repel water and decrease resistance. Many competitors adopted it at the Beijing Olympics that year, setting several world records. Whether this was due entirely to the new bodysuits was debatable, but even if the effect on actual times was negligible, the suit appears to have given the wearers a psychological advantage, thus helping them rise to the occasion. Amid the controversy, swimming's governing body moved to ban their use and has since enacted rules to limit how much of a swimmer's body can be covered by their swimwear.

The use of technology in sports looks set to remain controversial for as long as there are winners and losers. The question remains as to how far governing bodies should go to restrict the use of technology and where to draw the line between “pure” sports and the unstoppable march of science.&lt;/div&gt;

opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;mc3_4&quot; value=&quot;0&quot;&gt; A. propelled&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;mc3_4&quot; value=&quot;1&quot;&gt; B. launched&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;6. It&amp;#x27;s ___ whether a new coach will improve the team&amp;#x27;s performance.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;mc3_5&quot; value=&quot;0&quot;&gt; A. immune&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;mc3_5&quot; value=&quot;1&quot;&gt; B. debatable&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;7. The statistics need to be checked for ___ .&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;mc3_6&quot; value=&quot;0&quot;&gt; A. flexibility&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;mc3_6&quot; value=&quot;1&quot;&gt; B. accuracy&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;8. There were several minor ___ between the two witnesses&amp;#x27; descriptions of the incident.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;mc3_7&quot; value=&quot;0&quot;&gt; A. limitations&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;mc3_7&quot; value=&quot;1&quot;&gt; B. discrepancies&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;9. The race is run through an area of ___ natural beauty.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;mc3_8&quot; value=&quot;0&quot;&gt; A. outstanding&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;mc3_8&quot; value=&quot;1&quot;&gt; B. groundbreaking&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;10. The new high-speed train makes the trip in a ___ of the time.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;mc3_9&quot; value=&quot;0&quot;&gt; A. fraction&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;mc3_9&quot; value=&quot;1&quot;&gt; B. duration&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;check&quot;&gt;CHECK&lt;/button&gt;&lt;button class=&quot;show&quot;&gt;SHOW ANSWERS&lt;/button&gt;&lt;button class=&quot;vocabBtn&quot; type=&quot;button&quot; onclick=&quot;toggleVocabulary(this)&quot;&gt;SHOW VOCABULARY&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;result&quot;&gt;&lt;/div&gt;&lt;/div&gt;

 &lt;div class=&quot;exercise&quot; style=&quot;margin-top:14px&quot;&gt;
   &lt;h3&gt;C — REDUCING STRESS&lt;/h3&gt;
   &lt;p&gt;Complete the text. Use the words below. Make any necessary changes.&lt;/p&gt;
   &lt;div class=&quot;wordbank&quot; id=&quot;stressBank&quot;&gt;&lt;span class=&quot;chip&quot;&gt;undergo&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;factor&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;fade away&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;adverse&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;optimize&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;peak performance&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;rise to the occasion&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;split second&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;respond&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;task at hand&lt;/span&gt;&lt;/div&gt;

   &lt;div class=&quot;stress-layout&quot;&gt;
     &lt;div class=&quot;stress-text-panel&quot;&gt;
       &lt;div class=&quot;stress-passage&quot;&gt;
To prepare for major sporting events, coaches help athletes (1) &lt;input class=&quot;stress-blank&quot; data-a=&quot;optimize&quot; type=&quot;text&quot;&gt; their physical fitness and hone their technique. However, in order for them to achieve (2) &lt;input class=&quot;stress-blank&quot; data-a=&quot;peak performance&quot; type=&quot;text&quot;&gt;, athletes also need to be able to deal with the mental pressure of competing. Similarly, the ability to manage stress is a major (3) &lt;input class=&quot;stress-blank&quot; data-a=&quot;factor&quot; type=&quot;text&quot;&gt; in determining whether students do well in exams.&lt;br&gt;&lt;br&gt;

When faced with a difficult situation like an exam or a competition, feelings of panic can take over. The body reacts involuntarily – heart rate increases and muscles tense. This reaction takes place in a (4) &lt;input class=&quot;stress-blank&quot; data-a=&quot;split second&quot; type=&quot;text&quot;&gt;, and can help the person (5) &lt;input class=&quot;stress-blank&quot; data-a=&quot;rise to the occasion&quot; type=&quot;text&quot;&gt; and, in some cases, do even better than expected. However, if someone is unable to relax and think clearly, this will have an (6) &lt;input class=&quot;stress-blank&quot; data-a=&quot;adverse&quot; type=&quot;text&quot;&gt; effect on their performance.&lt;br&gt;&lt;br&gt;

Some American universities are now using biofeedback technology to help students control how their bodies (7) &lt;input class=&quot;stress-blank&quot; data-a=&quot;respond&quot; type=&quot;text&quot;&gt; to stress. During biofeedback, students are shown physiological information, such as their temperature and heart rate, on a monitor, and they are taught to recognize how their body reacts to stress. They then (8) &lt;input class=&quot;stress-blank&quot; data-a=&quot;undergo&quot; type=&quot;text&quot;&gt; training in relaxation and breathing techniques to help stress and tension (9) &lt;input class=&quot;stress-blank&quot; data-a=&quot;fade away&quot; type=&quot;text&quot;&gt;. Once the student is calm, they will be able to focus on the (10) &lt;input class=&quot;stress-blank&quot; data-a=&quot;task at hand&quot; type=&quot;text&quot;&gt; and are more likely to reach their full potential.
       &lt;/div&gt;

  &lt;div class=&quot;exercise&quot;&gt;&lt;h3&gt;D — Collocations&lt;/h3&gt;&lt;p&gt;Cross out / select the noun that does &lt;b&gt;NOT&lt;/b&gt; form a collocation with the verb.&lt;/p&gt;&lt;div class=&quot;mcMount&quot;&gt;&lt;/div&gt;&lt;div id=&quot;colloc&quot;&gt;&lt;div class=&quot;question&quot; data-answer=&quot;2&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;1. undergo&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_0&quot; value=&quot;0&quot;&gt; A. training&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_0&quot; value=&quot;1&quot;&gt; B. surgery&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_0&quot; value=&quot;2&quot;&gt; C. behavior&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_0&quot; value=&quot;3&quot;&gt; D. treatment&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_0&quot; value=&quot;4&quot;&gt; E. scrutiny&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_0&quot; value=&quot;5&quot;&gt; F. a transformation&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;4&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;2. execute&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_1&quot; value=&quot;0&quot;&gt; A. a task&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_1&quot; value=&quot;1&quot;&gt; B. an instruction&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_1&quot; value=&quot;2&quot;&gt; C. a plan&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_1&quot; value=&quot;3&quot;&gt; D. a command&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_1&quot; value=&quot;4&quot;&gt; E. a hope&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_1&quot; value=&quot;5&quot;&gt; F. an order&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;4&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;3. shift&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_2&quot; value=&quot;0&quot;&gt; A. the emphasis&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_2&quot; value=&quot;1&quot;&gt; B. the blame&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_2&quot; value=&quot;2&quot;&gt; C. my weight&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_2&quot; value=&quot;3&quot;&gt; D. the balance&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_2&quot; value=&quot;4&quot;&gt; E. the measure&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_2&quot; value=&quot;5&quot;&gt; F. the responsibility&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;5&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;4. enhance&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_3&quot; value=&quot;0&quot;&gt; A. performance&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_3&quot; value=&quot;1&quot;&gt; B. one&amp;#x27;s appearance&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_3&quot; value=&quot;2&quot;&gt; C. the effect&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_3&quot; value=&quot;3&quot;&gt; D. one&amp;#x27;s reputation&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_3&quot; value=&quot;4&quot;&gt; E. the quality&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_3&quot; value=&quot;5&quot;&gt; F. the cost&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;3&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;5. question&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_4&quot; value=&quot;0&quot;&gt; A. a claim&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_4&quot; value=&quot;1&quot;&gt; B. the wisdom of&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_4&quot; value=&quot;2&quot;&gt; C. your motives&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_4&quot; value=&quot;3&quot;&gt; D. a mood&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_4&quot; value=&quot;4&quot;&gt; E. someone&amp;#x27;s authority&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;colloc_4&quot; value=&quot;5&quot;&gt; F. a decision&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;check&quot; onclick=&quot;checkChoiceRows('colloc',[2,3,3,5,3],this)&quot;&gt;CHECK&lt;/button&gt;&lt;button class=&quot;show&quot; onclick=&quot;showChoiceRows('colloc',[2,3,3,5,3])&quot;&gt;SHOW ANSWERS&lt;/button&gt;&lt;button class=&quot;vocabBtn&quot; type=&quot;button&quot; onclick=&quot;toggleVocabulary(this)&quot;&gt;SHOW VOCABULARY&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;result&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;exercise&quot; id=&quot;meaningE&quot; style=&quot;margin-top:14px&quot;&gt;&lt;h3&gt;E — Words related in meaning&lt;/h3&gt;&lt;p&gt;Choose the sentence or expression that is closest in meaning.&lt;/p&gt;&lt;div class=&quot;mcMount&quot;&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;1. The team's success is largely attributed to its coach.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_0&quot; value=&quot;0&quot;&gt; A. The coach is held accountable for the team's success.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_0&quot; value=&quot;1&quot;&gt; B. The team's success is ascribed to its coach.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_0&quot; value=&quot;2&quot;&gt; C. The team's success is credited to the players.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;2. She is a famous athlete who promotes several brands.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_1&quot; value=&quot;0&quot;&gt; A. She endorses several brands.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_1&quot; value=&quot;1&quot;&gt; B. She publicizes several brands.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_1&quot; value=&quot;2&quot;&gt; C. She sponsors several brands.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;3. You need to focus all your energy on achieving your goal.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_2&quot; value=&quot;0&quot;&gt; A. You need to distract yourself from your goal.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_2&quot; value=&quot;1&quot;&gt; B. You need to concentrate all your energy on achieving your goal.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_2&quot; value=&quot;2&quot;&gt; C. You need to shift responsibility for your goal.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;4. The new technology has improved athletic performance.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_3&quot; value=&quot;0&quot;&gt; A. It has impaired athletic performance.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_3&quot; value=&quot;1&quot;&gt; B. It has enhanced athletic performance.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_3&quot; value=&quot;2&quot;&gt; C. It has inhibited athletic performance.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;5. The athlete experienced difficulties during training.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_4&quot; value=&quot;0&quot;&gt; A. The athlete encountered difficulties during training.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_4&quot; value=&quot;1&quot;&gt; B. The athlete executed difficulties during training.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;meaningE_4&quot; value=&quot;2&quot;&gt; C. The athlete conferred difficulties during training.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;check&quot; type=&quot;button&quot; onclick=&quot;checkMC(this)&quot;&gt;CHECK&lt;/button&gt;&lt;button class=&quot;show&quot; type=&quot;button&quot; onclick=&quot;showMC(this)&quot;&gt;SHOW ANSWERS&lt;/button&gt;&lt;button class=&quot;vocabBtn&quot; type=&quot;button&quot; onclick=&quot;toggleVocabulary(this)&quot;&gt;SHOW VOCABULARY&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;result&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;section id=&quot;cloze&quot;&gt;
 &lt;div class=&quot;sectionHead&quot;&gt;&lt;h2&gt;CLOZE&lt;br&gt;LAB&lt;/h2&gt;&lt;span&gt;04 / EXAM PRACTICE&lt;/span&gt;&lt;/div&gt;
 &lt;div class=&quot;card lime&quot;&gt;&lt;h3&gt;Exam Focus&lt;/h3&gt;&lt;p&gt;The cloze passage often tests phrases with gerunds and infinitives: &lt;b&gt;for + gerund&lt;/b&gt; (function/reason), &lt;b&gt;by + gerund&lt;/b&gt; (method), and &lt;b&gt;infinitive&lt;/b&gt; (purpose).&lt;/p&gt;&lt;/div&gt;
 &lt;div class=&quot;exercise&quot; style=&quot;margin-top:14px&quot;&gt;&lt;h3&gt;A — Choose the correct answer&lt;/h3&gt;&lt;div id=&quot;clozeA&quot;&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;1. GPS systems are used ___ player movements in team sports such as football.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;clozeA_0&quot; value=&quot;0&quot;&gt; A. by monitoring&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;clozeA_0&quot; value=&quot;1&quot;&gt; B. for monitoring&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;2. Scientists have studied the force created by water polo players&amp;#x27; kicking motions ___ their understanding of underwater propulsion.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;clozeA_1&quot; value=&quot;0&quot;&gt; A. to improve&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;clozeA_1&quot; value=&quot;1&quot;&gt; B. for improving&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;3. A sports sole that precisely measures foot movements could lead to significant advances for athletes ___ them improve their running technique.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;clozeA_2&quot; value=&quot;0&quot;&gt; A. by helping&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;clozeA_2&quot; value=&quot;1&quot;&gt; B. for helping&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;check&quot;  &lt;div class=&quot;exercise&quot; style=&quot;margin-top:14px&quot;&gt;&lt;h3&gt;B — Gene Doping: complete cloze&lt;/h3&gt;
&lt;div style=&quot;display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin:12px 0 24px&quot;&gt;
&lt;div&gt;&lt;p&gt;Read the passage. Then choose the word or phrase that fills each blank in both meaning and grammar.&lt;/p&gt;&lt;/div&gt;
&lt;img src=&quot;https://images.pexels.com/photos/4031416/pexels-photo-4031416.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1200&quot; alt=&quot;Sports science laboratory&quot; style=&quot;width:100%;height:240px;object-fit:cover;border-radius:18px;border:1px solid #51572f&quot;&gt;
&lt;/div&gt;&lt;div class=&quot;clozeText&quot;&gt;Athletes have always struggled to achieve record-breaking performances, but some have done so through artificial means. A sophisticated method of (1) ______ performance may be possible. Gene doping refers to the use of gene therapy treatments for non-medical reasons. During (2) ______, DNA is injected into the body to cause changes in a person's physical ability or endurance. (3) ______, gene therapy is open to abuse by athletes because one of its side effects is improved athletic ability, hence the term gene doping.

There are also synthetic drugs available that replicate some of the side effects of gene therapy. For example, people suffering from severe anemia can now (4) ______ with a genetically engineered form or erythropoietin (or EPO) – the hormone (5) ______ with red blood cell production. This is injected into the bloodstream to counteract the effects of anemia (6) ______ the production of red blood cells, thus increasing the amount of oxygen carried to muscles. Since physical endurance increases (7) ______ with higher oxygen levels in the muscles, EPO became a much (8) ______ drug among some cyclists and long-distance runners. However, EPO can have an (9) ______ effect on health, causing thickening of the blood, (10) ______ heart function and lead to heart attacks. Unfortunately, it appears that neither risk of death nor disqualification from competition is sufficient to deter some athletes from using drugs like EPO.&lt;/div&gt;&lt;div id=&quot;clozeB&quot;&gt;&lt;div class=&quot;question&quot; data-answer=&quot;2&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;1. Choose the word or phrase that best completes blank 1.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_0&quot; value=&quot;0&quot;&gt; A. endorsing&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_0&quot; value=&quot;1&quot;&gt; B. encountering&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_0&quot; value=&quot;2&quot;&gt; C. enhancing&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_0&quot; value=&quot;3&quot;&gt; D. engaging&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;2. Choose the word or phrase that best completes blank 2.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_1&quot; value=&quot;0&quot;&gt; A. such therapy&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_1&quot; value=&quot;1&quot;&gt; B. the first priority&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_1&quot; value=&quot;2&quot;&gt; C. a long time&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_1&quot; value=&quot;3&quot;&gt; D. one attempt&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;3. Choose the word or phrase that best completes blank 3.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_2&quot; value=&quot;0&quot;&gt; A. by curing&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_2&quot; value=&quot;1&quot;&gt; B. to cure&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_2&quot; value=&quot;2&quot;&gt; C. as a cure&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_2&quot; value=&quot;3&quot;&gt; D. so that curing&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;4. Choose the word or phrase that best completes blank 4.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_3&quot; value=&quot;0&quot;&gt; A. undergo&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_3&quot; value=&quot;1&quot;&gt; B. surpass&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_3&quot; value=&quot;2&quot;&gt; C. adopt&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_3&quot; value=&quot;3&quot;&gt; D. provide&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;3&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;5. Choose the word or phrase that best completes blank 5.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_4&quot; value=&quot;0&quot;&gt; A. responsible&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_4&quot; value=&quot;1&quot;&gt; B. conducive&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_4&quot; value=&quot;2&quot;&gt; C. devoted&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_4&quot; value=&quot;3&quot;&gt; D. associated&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;2&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;6. Choose the word or phrase that best completes blank 6.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_5&quot; value=&quot;0&quot;&gt; A. will generate&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_5&quot; value=&quot;1&quot;&gt; B. for generating&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_5&quot; value=&quot;2&quot;&gt; C. by generating&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_5&quot; value=&quot;3&quot;&gt; D. having generated&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;7. Choose the word or phrase that best completes blank 7.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_6&quot; value=&quot;0&quot;&gt; A. approximately&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_6&quot; value=&quot;1&quot;&gt; B. proportionately&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_6&quot; value=&quot;2&quot;&gt; C. predominantly&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_6&quot; value=&quot;3&quot;&gt; D. solely&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;3&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;8. Choose the word or phrase that best completes blank 8.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_7&quot; value=&quot;0&quot;&gt; A. classified&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_7&quot; value=&quot;1&quot;&gt; B. respected&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_7&quot; value=&quot;2&quot;&gt; C. uncommon&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_7&quot; value=&quot;3&quot;&gt; D. sought-after&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;9. Choose the word or phrase that best completes blank 9.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_8&quot; value=&quot;0&quot;&gt; A. other&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_8&quot; value=&quot;1&quot;&gt; B. adverse&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_8&quot; value=&quot;2&quot;&gt; C. excess&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_8&quot; value=&quot;3&quot;&gt; D. inhibiting&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;10. Choose the word or phrase that best completes blank 10.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_9&quot; value=&quot;0&quot;&gt; A. which can impair&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_9&quot; value=&quot;1&quot;&gt; B. that can end up&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_9&quot; value=&quot;2&quot;&gt; C. because it will stop&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;gene_9&quot; value=&quot;3&quot;&gt; D. which has affected&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;check&quot; onclick=&quot;checkChoiceRows('clozeB',[2, 0, 1, 0, 3, 2, 1, 3, 1, 0],this)&quot;&gt;CHECK&lt;/button&gt;&lt;button class=&quot;show&quot; onclick=&quot;showChoiceRows('clozeB',[2, 0, 1, 0, 3, 2, 1, 3, 1, 0])&quot;&gt;SHOW ANSWERS&lt;/button&gt;&lt;button class=&quot;vocabBtn&quot; type=&quot;button&quot; onclick=&quot;toggleVocabulary(this)&quot;&gt;SHOW VOCABULARY&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;result&quot;&gt;&lt;/div&gt;&lt;/div&gt;

 &lt;div class=&quot;audioPlaceholder&quot;&gt;&lt;span class=&quot;audioBadge&quot;&gt;AUDIO PLACEHOLDER&lt;/span&gt;&lt;h3 style=&quot;margin-top:18px&quot;&gt;Part 2: Short Talks&lt;/h3&gt;&lt;p&gt;The two listening question sets from the scanned unit are preserved below. Audio can be connected later without rebuilding the exercise.&lt;/p&gt;&lt;/div&gt;
 &lt;div class=&quot;grid2&quot; style=&quot;margin-top:14px&quot;&gt;
  &lt;div class=&quot;unitAudioPlayer&quot;&gt;&lt;b&gt;LISTENING AUDIO — EXERCISE A&lt;/b&gt;&lt;audio controls preload=&quot;metadata&quot;&gt;&lt;source src=&quot;assets/audio_03_4ece6b0dbd103862.mp3&quot; type=&quot;audio/mpeg&quot;&gt;&lt;/audio&gt;&lt;/div&gt;&lt;div class=&quot;exercise&quot; id=&quot;listenA&quot;&gt;&lt;h3&gt;A — Short talk: A Fair Chance for All?&lt;/h3&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;1. What does the speaker imply about A Fair Chance for All?&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_0&quot; value=&quot;0&quot;&gt; A. It&amp;#x27;s a non-profit organization.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_0&quot; value=&quot;1&quot;&gt; B. It gives young people free tickets.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_0&quot; value=&quot;2&quot;&gt; C. It is a new organization.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_0&quot; value=&quot;3&quot;&gt; D. It organizes sporting competitions.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;2&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;2. How did the speaker meet Gregory Lopez?&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_1&quot; value=&quot;0&quot;&gt; A. He once offered her a job.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_1&quot; value=&quot;1&quot;&gt; B. They met in a restaurant.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_1&quot; value=&quot;2&quot;&gt; C. She wrote an article about him.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_1&quot; value=&quot;3&quot;&gt; D. They were involved in the same sport.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;3. What will the audience probably hear soon?&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_2&quot; value=&quot;0&quot;&gt; A. news about famous athletes&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_2&quot; value=&quot;1&quot;&gt; B. some amusing stories&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_2&quot; value=&quot;2&quot;&gt; C. information about a charity&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_2&quot; value=&quot;3&quot;&gt; D. some facts about young athletes&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;4. What does the speaker say about photographs?&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_3&quot; value=&quot;0&quot;&gt; A. Money should be offered if you want one.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_3&quot; value=&quot;1&quot;&gt; B. None should be taken during dinner.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_3&quot; value=&quot;2&quot;&gt; C. Greg enjoys being photographed.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_3&quot; value=&quot;3&quot;&gt; D. The photographer should be paid.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;3&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;5. What is the speaker&amp;#x27;s main purpose?&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_4&quot; value=&quot;0&quot;&gt; A. to ask for donations&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_4&quot; value=&quot;1&quot;&gt; B. to promote a charity&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_4&quot; value=&quot;2&quot;&gt; C. to present an award&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_4&quot; value=&quot;3&quot;&gt; D. to introduce another speaker&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;6. What does the speaker mean by “without further ado”?&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_5&quot; value=&quot;0&quot;&gt; A. I don&amp;#x27;t want to make a fuss.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_5&quot; value=&quot;1&quot;&gt; B. Let&amp;#x27;s not wait any longer.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_5&quot; value=&quot;2&quot;&gt; C. We&amp;#x27;ll start in a few minutes.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenA_5&quot; value=&quot;3&quot;&gt; D. There isn&amp;#x27;t much to say.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;check&quot;&gt;CHECK&lt;/button&gt;&lt;button class=&quot;show&quot;&gt;SHOW ANSWERS&lt;/button&gt;&lt;button class=&quot;vocabBtn&quot; type=&quot;button&quot; onclick=&quot;toggleVocabulary(this)&quot;&gt;SHOW VOCABULARY&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;result&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;unitAudioPlayer&quot;&gt;&lt;b&gt;LISTENING AUDIO — EXERCISE B&lt;/b&gt;&lt;audio controls preload=&quot;metadata&quot;&gt;&lt;source src=&quot;assets/audio_04_982290599a952877.mp3&quot; type=&quot;audio/mpeg&quot;&gt;&lt;/audio&gt;&lt;/div&gt;&lt;div class=&quot;exercise&quot; id=&quot;listenB&quot;&gt;&lt;h3&gt;B — Student presentation: a place visited&lt;/h3&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;1. Why is the speaker most likely discussing his visit?&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_0&quot; value=&quot;0&quot;&gt; A. His teacher requested it.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_0&quot; value=&quot;1&quot;&gt; B. He went there on a school trip.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_0&quot; value=&quot;2&quot;&gt; C. They learned about the place in history class.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_0&quot; value=&quot;3&quot;&gt; D. His classmates are baseball fans.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;2. What does the speaker say about seating at the ballpark?&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_1&quot; value=&quot;0&quot;&gt; A. There should be more seats.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_1&quot; value=&quot;1&quot;&gt; B. The seating capacity is an advantage.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_1&quot; value=&quot;2&quot;&gt; C. People find it hard to find their seats.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_1&quot; value=&quot;3&quot;&gt; D. It holds more fans than other venues.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;3&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;3. Why does the speaker mention the scoreboard?&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_2&quot; value=&quot;0&quot;&gt; A. to explain a change to the stadium&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_2&quot; value=&quot;1&quot;&gt; B. to praise the staff at the stadium&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_2&quot; value=&quot;2&quot;&gt; C. to show how modern the stadium is&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_2&quot; value=&quot;3&quot;&gt; D. to describe an interesting feature&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;4. What is probably true about the speaker?&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_3&quot; value=&quot;0&quot;&gt; A. He tried to buy a ticket for a game.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_3&quot; value=&quot;1&quot;&gt; B. He got a player&amp;#x27;s autograph.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_3&quot; value=&quot;2&quot;&gt; C. He has met some baseball players.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_3&quot; value=&quot;3&quot;&gt; D. He didn&amp;#x27;t prepare his presentation.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;2&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;5. What will the speaker probably do next?&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_4&quot; value=&quot;0&quot;&gt; A. provide some information on Boston&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_4&quot; value=&quot;1&quot;&gt; B. play a video from a baseball game&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_4&quot; value=&quot;2&quot;&gt; C. show some videos and pictures&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_4&quot; value=&quot;3&quot;&gt; D. talk about the history of the Red Sox&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;3&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;6. What does “a rite of passage” mean here?&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_5&quot; value=&quot;0&quot;&gt; A. They have to earn their place on the team.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_5&quot; value=&quot;1&quot;&gt; B. No fans can enter this area.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_5&quot; value=&quot;2&quot;&gt; C. This is how they cross the field.&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;listenB_5&quot; value=&quot;3&quot;&gt; D. This is an important moment for them.&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;check&quot;&gt;CHECK&lt;/button&gt;&lt;button class=&quot;show&quot;&gt;SHOW ANSWERS&lt;/button&gt;&lt;button class=&quot;vocabBtn&quot; type=&quot;button&quot; onclick=&quot;toggleVocabulary(this)&quot;&gt;SHOW VOCABULARY&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;result&quot;&gt;&lt;/div&gt;&lt;/div&gt;

&lt;section id=&quot;final-vocab-review&quot;&gt;
 &lt;div class=&quot;sectionHead&quot;&gt;&lt;h2&gt;UNIT 02&lt;br&gt;VOCABULARY BANK&lt;/h2&gt;&lt;span&gt;FINAL REVIEW&lt;/span&gt;&lt;/div&gt;
 &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Key Vocabulary — English → Ελληνικά&lt;/h3&gt;
 &lt;div class=&quot;vocab-table&quot;&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;pinpoint&lt;/strong&gt; — εντοπίζω με ακρίβεια&lt;em&gt;Researchers pinpointed the factor that affected performance.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;sought-after&lt;/strong&gt; — περιζήτητος&lt;em&gt;Peak performance is a much sought-after state.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;discrepancy&lt;/strong&gt; — διαφορά / ασυμφωνία&lt;em&gt;There was a small discrepancy between the two results.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;immune to&lt;/strong&gt; — ανεπηρέαστος από&lt;em&gt;Elite athletes learn to become immune to distractions.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;hone&lt;/strong&gt; — τελειοποιώ&lt;em&gt;Athletes spend years honing their skills.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;propel&lt;/strong&gt; — προωθώ&lt;em&gt;The shoe is designed to propel runners forward.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;feat&lt;/strong&gt; — επίτευγμα&lt;em&gt;Running a marathon in under two hours was an extraordinary feat.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;counteract&lt;/strong&gt; — εξουδετερώνω&lt;em&gt;The design helps counteract drag.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;impede&lt;/strong&gt; — εμποδίζω&lt;em&gt;Water resistance can impede a swimmer's progress.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;buoyancy&lt;/strong&gt; — άνωση&lt;em&gt;The suit was designed to enhance buoyancy.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;negligible&lt;/strong&gt; — αμελητέος&lt;em&gt;The difference in finishing times was negligible.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;adverse&lt;/strong&gt; — δυσμενής&lt;em&gt;Stress can have an adverse effect on performance.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;optimize&lt;/strong&gt; — βελτιστοποιώ&lt;em&gt;Coaches help athletes optimize their performance.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;undergo&lt;/strong&gt; — υποβάλλομαι σε&lt;em&gt;The athletes underwent intensive training.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;deteriorate&lt;/strong&gt; — χειροτερεύω&lt;em&gt;His performance began to deteriorate.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;deplete&lt;/strong&gt; — εξαντλώ&lt;em&gt;Intense exercise can deplete energy reserves.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;endorse&lt;/strong&gt; — υποστηρίζω / διαφημίζω&lt;em&gt;Famous athletes often endorse sports products.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;conducive to&lt;/strong&gt; — ευνοϊκός για&lt;em&gt;A calm environment is conducive to concentration.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;gain ground&lt;/strong&gt; — κερδίζω έδαφος&lt;em&gt;The new training method is gaining ground.&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;vocab-entry&quot;&gt;&lt;strong&gt;rise to the occasion&lt;/strong&gt; — ανταποκρίνομαι στις απαιτήσεις&lt;em&gt;She rose to the occasion in the final.&lt;/em&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;exercise vocab-final&quot; id=&quot;ecpeVocabReview&quot;&gt;&lt;h3&gt;ECPE-STYLE VOCABULARY REVIEW&lt;/h3&gt;
 &lt;p&gt;Choose the option that best completes each sentence.&lt;/p&gt;&lt;div id=&quot;ecpeReviewRows&quot;&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;1. Despite the pressure of the final, the athlete managed to ___ and deliver her best performance.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_0&quot; value=&quot;0&quot;&gt; A. fade away&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_0&quot; value=&quot;1&quot;&gt; B. rise to the occasion&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_0&quot; value=&quot;2&quot;&gt; C. draw the line&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_0&quot; value=&quot;3&quot;&gt; D. gain ground&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;2&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;2. The difference between the two recorded times was so small that it was considered ___.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_1&quot; value=&quot;0&quot;&gt; A. adverse&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_1&quot; value=&quot;1&quot;&gt; B. outstanding&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_1&quot; value=&quot;2&quot;&gt; C. negligible&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_1&quot; value=&quot;3&quot;&gt; D. conventional&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;3. The new material was designed to ___ water resistance and improve the swimmer&amp;#x27;s speed.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_2&quot; value=&quot;0&quot;&gt; A. counteract&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_2&quot; value=&quot;1&quot;&gt; B. endorse&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_2&quot; value=&quot;2&quot;&gt; C. deplete&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_2&quot; value=&quot;3&quot;&gt; D. distort&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;4. Regular practice allows athletes to ___ the skills required for competition.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_3&quot; value=&quot;0&quot;&gt; A. impede&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_3&quot; value=&quot;1&quot;&gt; B. hone&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_3&quot; value=&quot;2&quot;&gt; C. repel&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_3&quot; value=&quot;3&quot;&gt; D. restrict&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;5. The company hired a famous runner to ___ its new range of sports shoes.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_4&quot; value=&quot;0&quot;&gt; A. undergo&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_4&quot; value=&quot;1&quot;&gt; B. endorse&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_4&quot; value=&quot;2&quot;&gt; C. surpass&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_4&quot; value=&quot;3&quot;&gt; D. encroach&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;6. Poor sleep can have an ___ effect on both concentration and physical performance.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_5&quot; value=&quot;0&quot;&gt; A. empirical&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_5&quot; value=&quot;1&quot;&gt; B. adverse&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_5&quot; value=&quot;2&quot;&gt; C. sought-after&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_5&quot; value=&quot;3&quot;&gt; D. immune&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;0&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;7. The researchers were able to ___ the exact moment at which concentration improved.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_6&quot; value=&quot;0&quot;&gt; A. pinpoint&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_6&quot; value=&quot;1&quot;&gt; B. propel&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_6&quot; value=&quot;2&quot;&gt; C. deplete&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_6&quot; value=&quot;3&quot;&gt; D. hinder&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;1&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;8. A supportive training environment is highly ___ better performance.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_7&quot; value=&quot;0&quot;&gt; A. associated with&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_7&quot; value=&quot;1&quot;&gt; B. conducive to&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_7&quot; value=&quot;2&quot;&gt; C. immune to&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_7&quot; value=&quot;3&quot;&gt; D. devoted to&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;2&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;9. The revolutionary technique is gradually ___ among professional coaches.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_8&quot; value=&quot;0&quot;&gt; A. rising to the occasion&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_8&quot; value=&quot;1&quot;&gt; B. drawing the line&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_8&quot; value=&quot;2&quot;&gt; C. gaining ground&lt;/label&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_8&quot; value=&quot;3&quot;&gt; D. fading away&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-answer=&quot;2&quot;&gt;&lt;div class=&quot;qtext&quot;&gt;10. After months of excessive training, the athlete&amp;#x27;s energy reserves had been seriously ___.&lt;/div&gt;&lt;div class=&quot;options&quot;&gt;&lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;review_9&quot; value=&quot;0&quot;&gt; A. propelled&     function normalize(value) {
      return (value || '').toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, ' ').trim();
    }
    function selectedValue(question) {
      const checked = question.querySelector('input[type="radio"]:checked');
      if (checked) return checked.value;
      const text = question.querySelector('input[type="text"]');
      return text ? text.value : '';
    }
    document.querySelectorAll('[data-check]').forEach(button => {
      button.addEventListener('click', () => {
        const quiz = button.closest('[data-quiz]');
        const questions = Array.from(quiz.querySelectorAll('.question'));
        let correct = 0;
        questions.forEach(question => {
          const answers = question.dataset.answer.split('|').map(normalize);
          const ok = answers.includes(normalize(selectedValue(question)));
          question.classList.toggle('correct', ok);
          question.classList.toggle('wrong', !ok);
          if (ok) correct += 1;
        });
        quiz.querySelector('.feedback').textContent = `Score: ${correct}/${questions.length}`;
      });
    });
    document.querySelectorAll('[data-show]').forEach(button => {
      button.addEventListener('click', () => button.closest('[data-quiz]').classList.add('show-answer'));
    });
  

    // Writing hero: lamp starts OFF and switches ON as soon as the section reaches the viewport.
    const writingStory = document.querySelector('.writing-story');
    if (writingStory) {
      writingStory.style.setProperty('--pull', '0');
      writingStory.classList.remove('lamp-on');
      const lampObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          // Wait until the Writing hero is clearly on screen before turning the lamp on.
          if (entry.isIntersecting && entry.intersectionRatio >= 0.42) {
            writingStory.classList.add('lamp-on');
          } else {
            writingStory.classList.remove('lamp-on');
          }
        });
      }, { threshold: [0, 0.42, 0.5] });
      lampObserver.observe(writingStory);
    }
